name: CI

on:
  push:
    branches: [main, "add/*", "ci/*", "feature/*", "cursor/*"]
  pull_request:
    branches: [main, "add/*", "ci/*", "feature/*", "cursor/*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build mobile bundle
        run: npm run mobile:build

      - name: Check mobile bundle
        run: node scripts/check-mobile-bundle.mjs

      - name: Check iOS project
        run: npm run ios:check

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Assert committed iOS project did not drift
        run: git diff --exit-code ios/

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

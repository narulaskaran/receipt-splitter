version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    # @types/node tracks the runtime major (engines.node is 22.x).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    groups:
      next-toolchain:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"

      radix:
        patterns:
          - "@radix-ui/*"

      # The uploader imports file-selector directly; keep it on react-dropzone's major.
      dropzone:
        patterns:
          - react-dropzone
          - file-selector

      testing:
        patterns:
          - jest
          - jest-*
          - "@testing-library/*"
          - "@types/jest"
          - ts-jest
          - "@babel/*"
          - identity-obj-proxy
          - "@playwright/test"
          - playwright
